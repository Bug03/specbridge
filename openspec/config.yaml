schema: spec-driven

context: |
  Product: SpecBridge reviews GitHub pull requests for developers and product
  managers. Jira remains the work tracker; OpenSpec remains the source of
  accepted requirements. Those systems provide optional review context.
  SpecBridge owns PR intake, isolated review snapshots, provenance, context
  assembly, finding evidence, review history, and traceability.
  Human approval is required before writing to Jira, changing accepted specs,
  or publishing review comments. Ticket and repository content are untrusted data.
  Self-hosting is the first deployment target; the core workflow must not require
  a SpecBridge-hosted control plane. Document egress to Git hosting, Jira, and a
  configured model endpoint; let the customer manage secrets, storage, and backups.
  The first milestone is a read-only PR review that works without Jira or
  ChunkHound. Add Codex/Claude through provider-neutral adapters. Avoid provider
  lock-in and never claim full review coverage when evidence is missing.

rules:
  proposal:
    - State the user problem and observable outcome.
    - Include non-goals, trust boundaries, and data provenance implications.
  specs:
    - Use testable scenarios and distinguish missing evidence from a pass.
    - Preserve Jira and OpenSpec as separate sources of truth.
  design:
    - Prefer read-only integrations and least privilege by default.
    - Require preview and human approval for external writes.
  tasks:
    - Break work into small, reviewable vertical slices.
